name: Daily MEA-06434 Outreach

on:
  schedule:
    # 06:00 UTC = 08:00 SAST
    - cron: '0 6 * * *'
    # 12:00 UTC = 14:00 SAST
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        working-directory: secure-enclosure-outreach
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: secure-enclosure-outreach
        run: playwright install --with-deps chromium

      - name: Run pipeline
        working-directory: secure-enclosure-outreach
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python scripts/maps_scraper.py
          python scripts/harvest_emails.py
          python scripts/send_emails.py

      - name: Commit updated CSV
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add secure-enclosure-outreach/data/master_companies.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "Update outreach CSV [skip ci]"
            git push
          fi
