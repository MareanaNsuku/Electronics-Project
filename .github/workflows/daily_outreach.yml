name: Daily MEA-06434 Outreach

on:
  schedule:
    - cron: '0 6 * * *'    # 08:00 SAST — morning config
    - cron: '0 12 * * *'   # 14:00 SAST — afternoon config
  workflow_dispatch:

# Prevent duplicate runs from cancelling each other
concurrency:
  group: outreach-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outreach:
    # Pin to Ubuntu 24.04 — skip the Ubuntu 26 migration entirely
    runs-on: ubuntu-24.04
    # Fail fast if runner can't be acquired (prevents 2h+ hangs)
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        working-directory: secure-enclosure-outreach
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: secure-enclosure-outreach
        run: playwright install --with-deps chromium

      - name: Pick config by time of day
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 9 ]; then
            echo "CONFIG_FILE=config.a.yaml" >> $GITHUB_ENV
          else
            echo "CONFIG_FILE=config.b.yaml" >> $GITHUB_ENV
          fi

      - name: Run pipeline
        working-directory: secure-enclosure-outreach
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python -u scripts/maps_scraper.py
          python -u scripts/harvest_emails.py
          python -u scripts/send_emails.py

      - name: Commit updated CSV
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add secure-enclosure-outreach/data/master_companies.csv
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "Update outreach CSV [skip ci]"
            git push
          fi
